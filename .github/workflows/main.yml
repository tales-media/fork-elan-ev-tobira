name: main

on:
  push:
    branches:
      - shio/*
    tags:
      - '*_shio.*'
  pull_request:
    branches:
      - shio/*

env:
  DOCKER_BUILDKIT: 1
  OCI_REGISTRY: rg.nl-ams.scw.cloud/shio-solutions
  OCI_REPO: tales-media/fork/tobira
  NODE_VERSION: lts
  RUST_VERSION: 1

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        if: ${{ github.event_name == 'push' }}
        with:
          registry: ${{ env.OCI_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: info
        run: |
          docker version
          docker info

      - name: set tag version
        if: ${{ github.ref_type == 'tag' }}
        run: |
          echo "${{ github.ref_name }}" > VERSION

      - name: build
        run: |
          ./x.sh build-container-image
          docker tag quay.io/opencast/tobira:latest "${OCI_REGISTRY}/${OCI_REPO}:latest"
          docker tag quay.io/opencast/tobira:latest "${OCI_REGISTRY}/${OCI_REPO}:${{ github.sha }}"
          docker tag quay.io/opencast/tobira:latest "${OCI_REGISTRY}/${OCI_REPO}:$(cat VERSION)"

      - name: push
        if: ${{ github.event_name == 'push' }}
        run: |
          docker push "${OCI_REGISTRY}/${OCI_REPO}:$(cat VERSION)"

      - name: push latest
        if: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
        run: |
          docker push "${OCI_REGISTRY}/${OCI_REPO}:latest"
